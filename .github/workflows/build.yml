name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Create Fresh Flutter Project & Replace Files
        run: |
          # বর্তমান রুট ফোল্ডারে একটি নতুন ফ্লাটার প্রজেক্ট তৈরি করুন (সাময়িক নাম temp_app)
          flutter create -t app temp_app --org com.example.barcouncil
          
          # আপনার কাস্টম main.dart এবং pubspec.yaml ফাইল নতুন প্রজেক্টে কপি করুন
          cp lib/main.dart temp_app/lib/main.dart
          cp pubspec.yaml temp_app/pubspec.yaml
          
          # কাজের সুবিধার্থে temp_app ফোল্ডারে প্রবেশ করুন
          cd temp_app
          
          # ডিপেন্ডেন্সি গেট করুন এবং রিলিজ এপিকে বিল্ড করুন
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          
